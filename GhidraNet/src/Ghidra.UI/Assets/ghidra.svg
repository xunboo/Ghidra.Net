<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B101D" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Dragon Scales & Plates Gradients -->
    <!-- Primary Horn -->
    <linearGradient id="hornMainGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="hornHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>

    <linearGradient id="hornDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Facial Plates Gradients -->
    <linearGradient id="plateLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="plateCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="70%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>

    <linearGradient id="plateDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <linearGradient id="plateMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="jawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490" />
      <stop offset="60%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#044E54" />
    </linearGradient>

    <!-- Glowing Ruby Eye Gradients & Filters -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="30%" stop-color="#FF3366" />
      <stop offset="70%" stop-color="#D50000" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>

    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Circuit Pattern -->
    <pattern id="circuitGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="64" cy="64" r="2" fill="#06B6D4" fill-opacity="0.2" />
      <circle cx="0" cy="0" r="2" fill="#10B981" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- 1. App Tile Container (Windows 11 Rounded Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#shadowFilter)" />

  <!-- 2. Cyber Circuit Grid Overlay -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#circuitGrid)" />

  <!-- 3. Ambient Radial Lighting -->
  <circle cx="256" cy="256" r="200" fill="url(#ambientGlow)" />

  <!-- 4. Subtle Circuit Traces in Background -->
  <g stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.25" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 80 120 L 140 120 L 170 150" />
    <circle cx="80" cy="120" r="3" fill="#06B6D4" fill-opacity="0.4" />
    <path d="M 430 380 L 370 380 L 340 350" />
    <circle cx="430" cy="380" r="3" fill="#10B981" fill-opacity="0.4" />
    <path d="M 390 100 L 350 140 L 350 180" />
    <path d="M 100 400 L 150 400 L 180 430" />
  </g>

  <!-- 5. Dragon Anatomy Group -->
  <g filter="url(#shadowFilter)">
    <!-- DORSAL SPINES (Neck Back) -->
    <!-- Spine 1 -->
    <polygon points="150,310 85,325 140,355" fill="url(#plateDark)" />
    <polygon points="150,310 85,325 130,320" fill="url(#hornHighlight)" opacity="0.4" />
    
    <!-- Spine 2 -->
    <polygon points="140,370 90,395 145,415" fill="url(#plateDark)" />
    <polygon points="140,370 90,395 130,380" fill="url(#hornHighlight)" opacity="0.3" />

    <!-- Spine 3 -->
    <polygon points="155,430 110,455 170,465" fill="url(#plateDark)" />

    <!-- SECONDARY LOWER HORN -->
    <path d="M 200,240 C 160,205 110,185 65,195 C 105,215 145,245 168,275 Z" fill="url(#hornDark)" />
    <path d="M 200,240 C 160,205 110,185 65,195 C 100,200 135,220 168,250 Z" fill="url(#hornMainGrad)" opacity="0.8" />

    <!-- TERTIARY OCCIPITAL HORN -->
    <path d="M 170,270 C 140,250 105,245 65,260 C 100,275 135,295 155,320 Z" fill="url(#plateDark)" />

    <!-- PRIMARY UPPER HORN (Majestic Swept-Back Horn) -->
    <!-- Lower shadow facet -->
    <path d="M 245,175 C 220,120 165,75 80,60 C 130,95 170,140 190,205 Z" fill="url(#hornDark)" />
    <!-- Main body facet -->
    <path d="M 245,175 C 220,120 165,75 80,60 C 120,75 180,110 220,165 Z" fill="url(#hornMainGrad)" />
    <!-- Bright top ridge / highlight -->
    <path d="M 220,165 C 180,110 120,75 80,60 C 110,65 150,85 190,125 Z" fill="url(#hornHighlight)" />

    <!-- REAR CRANIAL CREST -->
    <polygon points="245,175 190,205 210,245 260,225" fill="url(#plateMid)" />
    <polygon points="210,245 168,275 195,305 235,280" fill="url(#plateDark)" />
    <polygon points="195,305 150,335 185,365 220,340" fill="url(#plateMid)" />

    <!-- NECK & THROAT ARMOR PLATES (Segmented Cyber Plates) -->
    <!-- Plate 1 -->
    <polygon points="260,345 325,340 310,395 240,390" fill="url(#plateCyan)" />
    <polygon points="260,345 325,340 315,355 250,360" fill="url(#hornHighlight)" opacity="0.4" />
    
    <!-- Plate 2 -->
    <polygon points="240,390 310,395 295,445 225,435" fill="url(#plateMid)" />
    <polygon points="240,390 310,395 300,410 235,405" fill="url(#plateLight)" opacity="0.3" />

    <!-- Plate 3 (Base) -->
    <polygon points="225,435 295,445 280,480 205,470" fill="url(#plateDark)" />

    <!-- LOWER JAW & MANDIBLE -->
    <!-- Jaw base -->
    <polygon points="265,335 320,330 355,310 295,315" fill="url(#jawGrad)" />
    <!-- Chin / Lower Beak -->
    <polygon points="355,310 405,295 375,325 330,345" fill="url(#plateCyan)" />
    <polygon points="355,310 405,295 370,305" fill="url(#hornHighlight)" opacity="0.6" />
    <!-- Sharp lower fang -->
    <polygon points="380,298 395,290 388,303" fill="#E2E8F0" />

    <!-- UPPER JAW & SNOUT -->
    <!-- Mouth inner recess -->
    <polygon points="295,315 355,310 390,285 320,290" fill="#031A1A" />
    <!-- Sharp upper fang -->
    <polygon points="385,280 400,286 392,275" fill="#FFFFFF" />

    <!-- SNOUT MAIN FACETS -->
    <!-- Lower snout ridge -->
    <polygon points="325,255 425,250 405,280 325,285" fill="url(#plateMid)" />
    <!-- Top bridge of snout -->
    <polygon points="325,205 440,240 425,250 325,255" fill="url(#plateLight)" />
    <!-- Snout top highlight bevel -->
    <polygon points="325,205 440,240 415,230 320,200" fill="url(#hornHighlight)" opacity="0.7" />
    
    <!-- Nostril / Intake Vent -->
    <polygon points="390,238 370,242 385,246" fill="#022C22" />
    <line x1="370" y1="242" x2="390" y2="238" stroke="#00F2FE" stroke-width="1.5" />

    <!-- BROW & CRANIAL ARMOR -->
    <!-- Forehead Plate -->
    <polygon points="245,175 325,205 295,235 235,215" fill="url(#plateLight)" />
    <polygon points="245,175 325,205 305,190 240,170" fill="url(#hornHighlight)" opacity="0.5" />
    
    <!-- Supraorbital Brow (Ridge over the eye) -->
    <polygon points="295,235 345,235 325,255 285,248" fill="url(#plateDark)" />
    <polygon points="295,235 345,235 340,230 290,230" fill="url(#hornHighlight)" opacity="0.8" />

    <!-- CHEEK & TEMPLE FACETS -->
    <polygon points="235,215 295,235 285,248 245,265" fill="url(#plateCyan)" />
    <polygon points="245,265 285,248 325,255 325,285 265,305" fill="url(#plateDark)" />
    <polygon points="265,305 325,285 320,330 265,335" fill="url(#plateMid)" />

    <!-- 6. THE ICONIC CRIMSON CYBER EYE -->
    <!-- Deep Eye Socket -->
    <polygon points="288,238 325,241 316,252 282,247" fill="#050811" />
    
    <!-- Radiant Red/Ruby Eye with Glow -->
    <polygon points="291,240 322,243 313,250 285,246" fill="url(#eyeGrad)" filter="url(#eyeGlow)" />
    
    <!-- Intense Inner Core Flare -->
    <polygon points="297,242 314,244 308,247 294,245" fill="#FFF9C4" />

    <!-- Eye Laser Accent Trail -->
    <line x1="322" y1="243" x2="350" y2="246" stroke="#FF1744" stroke-width="2" stroke-linecap="round" opacity="0.8" filter="url(#eyeGlow)" />
    <line x1="350" y1="246" x2="410" y2="246" stroke="#FF5252" stroke-width="1" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- 7. High-Tech Hexagonal & Reverse-Engineering Engravings -->
  <g stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.5" fill="none">
    <!-- Tech lines on neck plate -->
    <path d="M 265 375 L 295 375 L 305 385" />
    <circle cx="305" cy="385" r="2" fill="#00F2FE" />
    
    <path d="M 250 418 L 275 418 L 285 428" />
    <circle cx="285" cy="428" r="2" fill="#10B981" />
  </g>

  <!-- 8. Sleek Ghidra Modern Badge (Lower Right) -->
  <g transform="translate(320, 415)">
    <!-- Badge Background -->
    <rect x="0" y="0" width="120" height="34" rx="8" fill="#0A1120" fill-opacity="0.85" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Text: Ghidra -->
    <text x="16" y="22" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-weight="800" font-size="14" fill="#38BDF8" letter-spacing="1">Ghidra</text>
    <circle cx="104" cy="17" r="4" fill="#10B981" />
  </g>

  <!-- 9. Code/Disassembly Accent Motif (Top Right) -->
  <g transform="translate(370, 75)" opacity="0.4">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#06B6D4">0x401000</text>
    <text x="0" y="16" font-family="Consolas, monospace" font-size="11" fill="#10B981">OP_DECOMP</text>
  </g>
</svg>
